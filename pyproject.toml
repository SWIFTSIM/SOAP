[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]

[project]
name = "SOAP"
version = "0.2.0"
description = "MPI parallel Python code to compute properties of halos in SWIFT n-body simulations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GNU LGPLv3+"}
authors = [
    {name = "Rob McGibbon", email = "mcgibbon@strw.leidenuniv.nl"}
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mpi4py",
    "h5py",
    "numpy>=2",
    "unyt>=3",
    "astropy>=6",
    "scipy",
    "matplotlib",
    "psutil",
    "virgodc>=1.0.5",
]

[project.optional-dependencies]
# Dependencies which are only required by some opt-in properties
extra_properties = [
    "healpy",
]
# Dependencies which are only required for running the tests
test = [
    "pytest-mpi",
    "numba",
    "SOAP[extra_properties]",
]
# Dependencies which are only required to build the documentation
docs = [
    "sphinx",
    "piccolo_theme",
    "sphinx_design",
    "sphinxcontrib-katex",
]

[project.urls]
"Homepage" = "https://github.com/SWIFTSIM/SOAP"
"Bug Tracker" = "https://github.com/SWIFTSIM/SOAP/issues"
